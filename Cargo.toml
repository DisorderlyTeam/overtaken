[workspace]
members = ["engine", "game", "exporter"]
exclude = ["vendor_tool"]
default-members = ["engine", "game"]
resolver = "3"

[workspace.package]
version = "0.1.2"
authors = ["Chilli <chilli@thechilli.dev>", "Cozie <shinyumbreon200220@gmail.com>"]
edition = "2024"
repository = "https://github.com/DisorderlyTeam/overtaken"
license = "AGPL-3.0-or-later"
rust-version = "1.94.0"

[workspace.dependencies]
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
thiserror = "2.0.18"
compact_str = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Reducing the size of the release binaries. Might significantly increase compile times
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Turning back optimizations in development builds for specific packages
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.kira]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.symphonia]
opt-level = 3

[profile.dev.package.symphonia-format-ogg]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[patch.crates-io]
gilrs-core = { path = "vendor/gilrs-core" }
